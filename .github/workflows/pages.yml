name: Deploy to GitHub Pages

on:
  # The deploy is gated on CI rather than running beside it. `verify` is a job in
  # ci.yml, so `needs:` cannot say this: `needs` resolves inside one workflow
  # file, and `needs: verify` in this file is a hard error - actionlint rejects it
  # with 'job "deploy" needs job "verify" which does not exist in this workflow'.
  # `workflow_run` is the cross-workflow form of the same edge. It fires whenever
  # the `CI` workflow completes; the `if` on the job below admits only a green one.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A half-published Pages build is worse than a cancelled test run, so deploys
  # queue rather than replace - `deploy-pages` has no lock of its own, and two
  # concurrent runs can interleave their activation step and leave an older SHA
  # live. The group stays a constant, not ref-keyed: every trigger here
  # publishes to the one site, so serialising a `workflow_dispatch` run from
  # another branch behind the in-flight deploy is the point, not a problem.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A green `verify` is the only thing that may publish. `workflow_run` fires on
    # every completion, so the conclusion is the gate: `failure`, `cancelled`,
    # `skipped` and `timed_out` all skip this job rather than deploy. That matters -
    # on 2026-10-04 both a red commit (58f8e2f) and three cancelled ones reached the
    # live site. A `workflow_dispatch` run has no triggering workflow to consult and
    # deploys the dispatched ref, as it always has.
    #
    # The `event == 'push'` clause is load-bearing, not defensive. `branches:` above
    # filters on the triggering run's `head_branch`, which for a `pull_request` run
    # is the PR's head branch - named by whoever opened the PR. A fork PR with its
    # branch called `main` passes that filter, and a green run on it would reach a
    # job holding `pages: write` and `id-token: write` with `npm ci` running the
    # fork's lifecycle scripts. The `github-pages` environment policy does not help:
    # under `workflow_run` the workflow's own ref is always the default branch, so
    # the policy evaluates `main` and passes. Only a `push`-triggered run may deploy.
    #
    # A skipped job still leaves this workflow green, so read the job list, not the
    # run's conclusion, to tell whether a deploy happened.
    #
    # The `head_repository.full_name` clause is defence in depth, not the fix. The
    # `event == 'push'` clause above is what closes the hole; this one independently
    # refuses any run whose code came from somewhere other than this repository, so a
    # future edit that loosens the event check does not reopen the hole on its own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # `GITHUB_SHA` is the default branch tip under `workflow_run`, not the commit CI
    # verified, so both the checkout and the SHA Vite inlines are pinned to the
    # triggering run's head. Without this a second merge landing while CI is still
    # running would publish untested code - the exact failure this gate exists to
    # stop. `workflow_dispatch` has no triggering run, so it falls back to its own
    # `github.sha`.
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The lockfile is committed, so `npm ci` is reproducible and fails the
          # deploy rather than silently resolving different versions.
          cache: npm
      # The site is built, not served from the checkout: index.html loads a Vite
      # bundle whose filename carries a content hash, which is what busts the
      # cache per deploy. That replaces the old sed that rewrote a ?v= stamp -
      # there is no query string left to rewrite, and editing the built HTML
      # would only desync it from the hash Vite derived.
      - name: Install and build
        # Vite inlines VITE_* at build time, so the deployed bundle carries the
        # exact SHA it was built from and the page puts it in its URL as
        # ?build=<sha> (src/app/buildSha.ts).
        env:
          VITE_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
