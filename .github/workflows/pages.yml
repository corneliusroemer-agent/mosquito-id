name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A half-published Pages build is worse than a cancelled test run, so deploys
  # queue rather than replace - `deploy-pages` has no lock of its own, and two
  # concurrent runs can interleave their activation step and leave an older SHA
  # live. The group stays a constant, not ref-keyed: every trigger here
  # publishes to the one site, so serialising a `workflow_dispatch` run from
  # another branch behind the in-flight deploy is the point, not a problem.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The lockfile is committed, so `npm ci` is reproducible and fails the
          # deploy rather than silently resolving different versions.
          cache: npm
      # The site is built, not served from the checkout: index.html loads a Vite
      # bundle whose filename carries a content hash, which is what busts the
      # cache per deploy. That replaces the old sed that rewrote a ?v= stamp -
      # there is no query string left to rewrite, and editing the built HTML
      # would only desync it from the hash Vite derived.
      - name: Install and build
        # Vite inlines VITE_* at build time, so the deployed bundle carries the
        # exact SHA it was built from and the page puts it in its URL as
        # ?build=<sha> (src/app/buildSha.ts).
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
