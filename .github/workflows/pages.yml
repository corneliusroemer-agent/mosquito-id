name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the commit into asset URLs
        run: |
          # Pages serves assets with max-age=600. The ?v= query is what makes a
          # new deploy reach browsers that still hold the previous copy, so it
          # has to change every deploy or it is not a cache buster at all.
          sed -i "s/\([?&]v=\)[^\"']*/\1${GITHUB_SHA}/g" index.html
          grep -n '?v=' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
