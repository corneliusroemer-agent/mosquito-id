name: CI

# The deploy workflow (`pages.yml`) builds and uploads on every push to main. It
# runs no test, so a merge that broke the app shipped silently - and a
# YAML indentation error once made that deploy exit in 0s, which is the failure
# `actionlint` below exists to catch before it can reach the workflow at all.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keyed on the ref, so a PR run never queues behind main: `github.ref` is
  # `refs/pull/<n>/merge` for pull_request and `refs/heads/<branch>` for a push,
  # which are distinct group names. Several agents merge all session, and a
  # cancel-in-progress group meant each new push killed the run in flight - a
  # cancelled run reads as red, and a signal that goes red for no reason is worse
  # than one that is occasionally wrong. Queue instead.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lints every workflow file, not just this one. A malformed step in a
      # workflow that runs on main is a deploy that fails in seconds with no
      # explanation, so it is checked before anything is merged.
      - name: Lint the workflow files
        uses: docker://rhysd/actionlint:1.7.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` first so the lockfile decides the versions: a test that passed
      # against one tree and not another is worse than no test.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Tier 1. This includes `strip-index-stability.spec.ts`, which was committed
      # RED as the reproduction for the wrong-tile bug in
      # docs/THUMBNAIL-STRIP-SPEC.md R5 and is green now that the strip's handlers
      # read a tile's index at event time instead of capturing it at build.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: E2E, tier 1 (the fast contract)
        run: npm run test:e2e

      # Tier 2 is NOT run here. It downloads ~180 MB and needs the model host to
      # allow the runner's origin, which it currently does not - see
      # e2e/tier2/README.md for the two measured blockers and how to run it:
      #     npm run test:e2e:model