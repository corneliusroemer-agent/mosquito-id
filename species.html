<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Species · Mosquito ID</title>
<meta http-equiv="refresh" content="0; url=index.html#/species/">
<link rel="canonical" href="index.html#/species/">
</head>
<body>
<!-- The species guide is a route of the classifier (#/species/<slug>), not a
     page of its own, so that reading a species and going back keeps the photo,
     the crop and the scores. This file stays only to carry old ?s= links:
     every species.html?s=<slug> URL that was shared, bookmarked or cached
     lands here and is replaced by the equivalent hash route. `replace`, not
     `assign`, so the redirect does not become a history entry the user has to
     press back through twice. -->
<p>Redirecting to the <a href="index.html#/species/">species guide</a>&hellip;</p>
<script>
  (function () {
    var slug = new URLSearchParams(location.search).get("s") || "";
    // Relative to this file, which sits next to index.html - works unchanged
    // under the /mosquito-id/ subpath.
    var target = "index.html" + (slug ? "#/species/" + slug : "#/species");
    // <noscript> users still get there via the meta refresh above.
    location.replace(target);
  })();
</script>
</body>
</html>
